services:
  ocr:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OCR_API_TOKEN: ${OCR_API_TOKEN:?Set a random token of at least 24 characters}
      OCR_ORIGINS: ${OCR_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
