<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Добавление автомобиля</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#F3F1EC;font-family:Manrope,'Segoe UI',sans-serif;color:#17191C}
a{color:#C2410C}a:hover{color:#9A3412}
button,select,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F1EC; display: flex; flex-direction: column">
<div style="flex-grow: 1; padding: 52px 20px 20px; display: flex; flex-direction: column; gap: 18px">
<a href="Garage.dc.html" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #17191C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15">Добавьте<br>автомобиль</h1>
<span style="font-size: 14px; color: #5B5F66">Подтянем характеристики из открытых источников</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E7E3DB; border-radius: 14px">
<button onClick="{{ pickPlate }}" style="{{ tabPlate }}">Госномер</button>
<button onClick="{{ pickVin }}" style="{{ tabVin }}">VIN</button>
<button onClick="{{ pickModel }}" style="{{ tabModel }}">Марка</button>
</div>
<sc-if value="{{ isPlate }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="plate" style="font-size: 13px; font-weight: 600; color: #5B5F66">Государственный номер</label>
<div style="display: flex; height: 64px; background: #FFFFFF; border: 2.5px solid #17191C; border-radius: 10px; overflow: hidden">
<input id="plate" value="А123ВС" style="flex-grow: 1; min-width: 0; border: none; outline: none; padding: 0 16px; font-family: 'JetBrains Mono', monospace; font-size: 28px; letter-spacing: 2px; color: #17191C; background: transparent">
<div style="width: 76px; border-left: 2.5px solid #17191C; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px">177</span><span style="font-size: 10px; font-weight: 700">RUS</span></div>
</div>
</div>
</sc-if>
<sc-if value="{{ isVin }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between"><label for="vin" style="font-size: 13px; font-weight: 600; color: #5B5F66">VIN-номер</label><span style="font-size: 13px; font-weight: 600; color: #0F6B3A">17 / 17</span></div>
<input id="vin" value="XWEFC41ABKC001234" style="height: 56px; padding: 0 14px; background: #FFFFFF; border: 1.5px solid #17191C; border-radius: 14px; outline: none; font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 1px; color: #17191C">
<span style="font-size: 12px; color: #5B5F66">VIN указан в СТС, ПТС и под лобовым стеклом</span>
</div>
</sc-if>
<sc-if value="{{ isModel }}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5B5F66">Марка<select style="height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid #E2DED6; background: #FFFFFF; font-size: 15px; color: #17191C"><option>Kia</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5B5F66">Модель<select style="height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid #E2DED6; background: #FFFFFF; font-size: 15px; color: #17191C"><option>Rio</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5B5F66">Поколение<select style="height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid #E2DED6; background: #FFFFFF; font-size: 15px; color: #17191C"><option>IV (2017–)</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5B5F66">Двигатель<select style="height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid #E2DED6; background: #FFFFFF; font-size: 15px; color: #17191C"><option>1.6 MPI АКПП</option></select></label>
</div>
</sc-if>
<div style="background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 999px; background: #0F6B3A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg></span><span style="font-weight: 700; font-size: 15px">Автомобиль найден</span></div>
<div style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 19px">Kia Rio IV, 2019</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; font-size: 13px">
<div><div style="color: #5B5F66">Двигатель</div><div style="font-weight: 600">1.6 MPI, 123 л.с.</div></div>
<div><div style="color: #5B5F66">КПП</div><div style="font-weight: 600">Автомат</div></div>
<div><div style="color: #5B5F66">Кузов</div><div style="font-weight: 600">Седан</div></div>
<div><div style="color: #5B5F66">VIN</div><div style="font-family: 'JetBrains Mono', monospace; font-weight: 500">XWE•••••1234</div></div>
</div>
<span style="font-size: 12px; color: #5B5F66">По данным открытых источников — [ИСТОЧНИК]</span>
</div>
</div>
<div style="padding: 0 20px 34px; display: flex; flex-direction: column; gap: 8px">
<a href="Garage.dc.html" style="height: 54px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Это мой автомобиль</a>
<button onClick="{{ pickModel }}" style="height: 44px; background: none; border: none; font-size: 14px; font-weight: 700; color: #5B5F66">Не то? Выбрать вручную</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#17191C","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'plate' }; }
  renderVals() {
    const t = this.state.tab;
    const on = 'height: 44px; border-radius: 10px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #17191C; box-shadow: 0 1px 2px rgba(0,0,0,0.08); cursor: pointer';
    const off = 'height: 44px; border-radius: 10px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #5B5F66; cursor: pointer';
    return {
      accent: this.props.accent ?? '#C2410C',
      isPlate: t === 'plate', isVin: t === 'vin', isModel: t === 'model',
      tabPlate: t === 'plate' ? on : off, tabVin: t === 'vin' ? on : off, tabModel: t === 'model' ? on : off,
      pickPlate: () => this.setState({ tab: 'plate' }),
      pickVin: () => this.setState({ tab: 'vin' }),
      pickModel: () => this.setState({ tab: 'model' })
    };
  }
}
</script>
</body>
</html>
