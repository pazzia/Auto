name: Web app (PWA)

# Веб-версия приложения на GitHub Pages: https://pazzia.github.io/Auto/
# Открывается в любом браузере и ставится на главный экран как приложение (PWA), после первого открытия работает офлайн.
#
# Публикуется отдельно от main: каждый пуш в ветку pwa собирает сайт и кладёт его в служебную ветку gh-pages,
# откуда его раздаёт GitHub Pages. Один раз включить: Settings → Pages → Source: Deploy from a branch → gh-pages / (root).
# Все actions закреплены по SHA коммита (в комментарии — тег).

on:
  push:
    branches: [pwa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Собрать веб-приложение из design/ и web/
        run: python3 tools/build_prototype.py
      - name: Тесты, в том числе состав веб-приложения
        run: node --test tests/document-parser.test.cjs tests/web-logic.test.cjs tests/gov.test.cjs tests/vincod.test.cjs tests/pwa.test.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-app
          retention-days: 7
          path: app/src/main/assets/www/

  # Отдельная задача: право записи в репозиторий есть только у шага, который кладёт готовый сайт в gh-pages.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-app
          path: site
      - name: Сайт — в служебную ветку gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site && touch .nojekyll && echo "${GITHUB_SHA}" > COMMIT
          [ -f index.html ] && [ -f sw.js ] && [ -f manifest.webmanifest ] || { echo "::error title=pages::Сборка неполная"; exit 1; }
          git init -q -b gh-pages && git add -A \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Web app ${GITHUB_SHA}" \
            && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
