name: Web app (PWA)

# Веб-версия приложения на GitHub Pages: https://pazzia.github.io/Auto/
# Открывается в любом браузере и ставится на главный экран как приложение (PWA), после первого открытия работает офлайн.
# Один раз включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Все actions закреплены по SHA коммита (в комментарии — тег).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Собрать веб-приложение из design/ и web/
        run: python3 tools/build_prototype.py
      - name: Тесты, в том числе состав веб-приложения
        run: node --test tests/document-parser.test.cjs tests/web-logic.test.cjs tests/gov.test.cjs tests/vincod.test.cjs tests/pwa.test.cjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: app/src/main/assets/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
