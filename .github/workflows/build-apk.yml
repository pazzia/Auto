name: Build APK

# Каждая сборка называется по номеру из файла VERSION:
#   артефакт и файл — AutoHub-<номер>.apk, релиз — «АвтоХаб <номер>» с тегом v<номер>.
# Релиз выпускается при пуше в main, только если прошли тесты разбора документов и OCR без сети.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocr-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/document-parser.test.cjs
      - name: Проверить синтаксис веб-модулей
        run: for f in web/*.js; do node --check "$f"; done
      - name: Проверить предобработку OCR (тот же Java-код, что в APK)
        run: |
          mkdir -p build/ocr-check
          javac -encoding UTF-8 -d build/ocr-check app/src/main/java/ru/autohub/app/OcrPreprocess.java tests/OcrPreprocessCheck.java
          java -cp build/ocr-check OcrPreprocessCheck

  build:
    needs: ocr-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Номер сборки
        run: echo "BUILD=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Собрать веб-прототип из design/ и web/
        run: python3 tools/build_prototype.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK с языками OCR
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Проверить модели OCR внутри APK
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              manifest = json.loads(apk.read('assets/ocr-models.json'))
              for lang in ('rus', 'eng'):
                  assert hashlib.sha256(apk.read(f'assets/tessdata/{lang}.traineddata')).hexdigest() == manifest[lang]
          print('Both OCR models are bundled and verified')
          PY

      - name: Включить ускорение эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверить OCR в режиме полёта
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            gradle :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ocr-test-results
          path: app/build/reports/androidTests/connected/

      - name: Переименовать APK по номеру сборки
        run: cp app/build/outputs/apk/debug/app-debug.apk "AutoHub-${BUILD}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoHub-${{ env.BUILD }}
          path: AutoHub-${{ env.BUILD }}.apk

      - name: Описание релиза из CHANGELOG.md
        if: github.event_name != 'pull_request'
        run: |
          awk -v v="## Сборка ${BUILD} " 'index($0, v)==1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Сборка ${BUILD}" > notes.md
          printf '\nФайл для Android: AutoHub-%s.apk. Установка поверх предыдущей версии.\n' "$BUILD" >> notes.md

      - name: Релиз «АвтоХаб <номер>»
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD }}
          name: АвтоХаб ${{ env.BUILD }}
          body_path: notes.md
          files: AutoHub-${{ env.BUILD }}.apk
          make_latest: true
