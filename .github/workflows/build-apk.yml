name: Build APK

# Каждая сборка называется по номеру из файла VERSION:
#   артефакт и файл — AutoHub-<номер>.apk, релиз — «АвтоХаб <номер>» с тегом v<номер>.
# Тесты OCR на эмуляторе — на debug-сборке. В артефакт и релиз уходит только release-сборка
# (debuggable=false), подписанная ключом из секретов AUTOHUB_KEYSTORE_BASE64, AUTOHUB_KEYSTORE_PASSWORD,
# AUTOHUB_KEY_ALIAS, AUTOHUB_KEY_PASSWORD. Релиз выпускается при пуше в main, только если прошли тесты
# разбора документов и OCR без сети. Все actions закреплены по SHA коммита (в комментарии — тег).

on:
  push:
    branches: [main, 'ocr-*']
  pull_request:
  workflow_dispatch:

# По умолчанию токен только читает. Запись — лишь задачам release и ocr-report.
permissions:
  contents: read

jobs:
  ocr-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/document-parser.test.cjs tests/web-logic.test.cjs tests/gov.test.cjs tests/vincod.test.cjs
      - name: Проверить синтаксис веб-модулей
        run: for f in web/*.js; do node --check "$f"; done
      - name: Проверить предобработку OCR (тот же Java-код, что в APK)
        run: |
          mkdir -p build/ocr-check
          javac -encoding UTF-8 -d build/ocr-check app/src/main/java/ru/autohub/app/OcrPreprocess.java tests/OcrPreprocessCheck.java
          java -cp build/ocr-check OcrPreprocessCheck

  # Debug-сборка + androidTest: тесты OCR на эмуляторе в режиме полёта. Debug-APK наружу не публикуется.
  build:
    needs: ocr-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Собрать веб-прототип из design/ и web/
        run: python3 tools/build_prototype.py

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      - name: Собрать debug APK и androidTest с языками OCR
        run: |
          # хвост ошибок — аннотациями: они читаются через REST API, даже когда логи недоступны
          set -o pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee gradle-build.log || {
            { grep -E "^e: |^.*\.(kt|java):[0-9]+: error" gradle-build.log | head -6; grep -A4 "What went wrong" gradle-build.log | head -4; } | while IFS= read -r l; do echo "::error title=gradle::$l"; done
            exit 1; }

      - name: Проверить модели OCR внутри APK
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              manifest = json.loads(apk.read('assets/ocr-models.json'))
              for lang in ('rus', 'eng'):
                  assert hashlib.sha256(apk.read(f'assets/tessdata/{lang}.traineddata')).hexdigest() == manifest[lang]
          print('Both OCR models are bundled and verified')
          PY

      # Release-сборка без подписи: её же (подписанную временным ключом) ставим на эмулятор и запускаем —
      # проверка, что именно release-вариант стартует, переживает поворот, тёмную тему и уход в фон.
      - name: Собрать release APK (без подписи) и копию для проверки запуска
        run: |
          set -o pipefail
          gradle :app:assembleRelease 2>&1 | tee gradle-release.log || {
            { grep -E "^e: |^.*\.(kt|java):[0-9]+: error|Error: " gradle-release.log | head -6; grep -A4 "What went wrong" gradle-release.log | head -4; } | while IFS= read -r l; do echo "::error title=gradle release::$l"; done
            exit 1; }
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$APK" ] || { echo "::error title=release::Нет $APK"; ls -R app/build/outputs/apk; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storetype PKCS12 -alias smoke -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=CI smoke test" -storepass smoke-test -keypass smoke-test
          "${BT}apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:smoke-test --out smoke-release.apk "$APK"
          mkdir -p handoff && cp "$APK" handoff/app-release-unsigned.apk && cp "${BT}lib/apksigner.jar" handoff/apksigner.jar
          "${BT}aapt" dump badging "$APK" | head -3 | tee handoff/badging.txt
          if grep -q "application-debuggable" handoff/badging.txt; then echo "::error title=release::APK собран как debuggable"; exit 1; fi

      - name: Включить ускорение эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверить OCR в режиме полёта
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=ru.autohub.app.RealDocumentAcceptanceTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ru.autohub.app.RealDocumentAcceptanceTest ru.autohub.app.test/androidx.test.runner.AndroidJUnitRunner | tee acceptance-instrument.txt
            adb pull /storage/emulated/0/Android/data/ru.autohub.app/files/ocr-acceptance.json ocr-acceptance.json
            bash tools/ci_smoke.sh handoff/api29

      - name: Приёмка OCR на эмуляторе — сверка с эталонами синтетических нарядов
        run: |
          grep -q "OK (1 test)" acceptance-instrument.txt
          node tools/ocr_replay/compare.cjs ocr-acceptance.json tests/fixtures/synthetic/synthetic-golden.json --only synth- --annotate
          node tools/ocr_replay/compare.cjs ocr-acceptance.json tests/fixtures/synthetic/synthetic-b-golden.json --only synthb- --annotate

      # Тот же запуск — на Android 14 с современным WebView, как на телефонах пользователей
      - name: Проверить запуск release-сборки на Android 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_smoke.sh handoff/api34

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apk-handoff
          retention-days: 3
          if-no-files-found: ignore
          path: handoff/

      # Распознанный текст документов наружу не выкладывается: ни в артефакт, ни в публичную ветку.
      # Остаются поля разбора, строки, метрики и SHA-256 текста проходов (textSha256).
      - name: Убрать распознанный текст из отчёта приёмки
        if: always()
        run: |
          [ -f ocr-acceptance.json ] || exit 0
          python3 - <<'PY'
          import hashlib, json
          with open('ocr-acceptance.json', encoding='utf-8') as f:
              report = json.load(f)
          for doc in report.get('documents', []):
              texts = doc.pop('text', None)
              if texts is not None and 'textSha256' not in doc:
                  doc['textSha256'] = [hashlib.sha256(t.encode('utf-8')).hexdigest() for t in texts]
          assert all('text' not in doc for doc in report.get('documents', [])), 'текст остался в отчёте'
          with open('ocr-acceptance.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=1)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: offline-ocr-test-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/connected/
            ocr-acceptance.json

  # Отчёт приёмки (без текста документов) — в служебную ветку ci-ocr-reports. Отдельная задача:
  # право записи в репозиторий не выдаётся сборке, эмулятору и сторонним actions.
  ocr-report:
    needs: build
    if: always() && github.event_name == 'push' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: offline-ocr-test-results
          path: ocr-results

      - name: Отчёт приёмки — в служебную ветку ci-ocr-reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f ocr-results/ocr-acceptance.json ] || { echo "Отчёта приёмки нет — пропуск"; exit 0; }
          python3 -c "import json,sys; d=json.load(open('ocr-results/ocr-acceptance.json', encoding='utf-8')); sys.exit(any('text' in x for x in d.get('documents', [])))" \
            || { echo "::error title=ocr-report::В отчёте остался распознанный текст — не публикуется"; exit 1; }
          mkdir -p "$RUNNER_TEMP/rep" && cp ocr-results/ocr-acceptance.json "$RUNNER_TEMP/rep/${GITHUB_SHA}.json"
          cd "$RUNNER_TEMP/rep" && git init -q -b ci-ocr-reports && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "OCR report ${GITHUB_SHA}" \
            && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-ocr-reports

  # Пока в репозитории нет секретов подписи (AUTO-44): ручной запуск workflow кладёт неподписанную release-сборку,
  # apksigner и снимки проверки запуска в служебную ветку ci-apk-handoff — APK подписывается ключом владельца вне CI.
  # В неподписанной сборке секретов нет. После появления секретов задачу можно удалить: релиз подпишет задача release.
  apk-handoff:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk-handoff
          path: handoff
      - name: Неподписанный APK — в служебную ветку ci-apk-handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd handoff && echo "${GITHUB_SHA}" > COMMIT && sha256sum app-release-unsigned.apk apksigner.jar > SHA256SUMS
          git init -q -b ci-apk-handoff && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Unsigned release APK ${GITHUB_SHA}" \
            && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-apk-handoff

  # Release-сборка (debuggable=false), подписанная ключом из секретов, и релиз «АвтоХаб <номер>».
  # Только при пуше в main и только после тестов на эмуляторе.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Номер сборки
        run: echo "BUILD=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Ключ подписи из секретов репозитория
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOHUB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUTOHUB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOHUB_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing AUTOHUB_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing AUTOHUB_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing AUTOHUB_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing AUTOHUB_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            # Не ошибка: до появления секретов APK подписывается вне CI (ветка ci-apk-handoff, tools/sign_handoff.sh)
            echo "::warning title=Подпись release::Нет секретов репозитория:$missing — релиз не выпущен. Добавьте их в Settings → Secrets and variables → Actions или подпишите сборку через tools/sign_handoff.sh."
            echo "SIGNING=no" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SIGNING=yes" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/autohub-release.jks"
          echo "AUTOHUB_KEYSTORE_FILE=$RUNNER_TEMP/autohub-release.jks" >> "$GITHUB_ENV"

      - name: Собрать веб-прототип из design/ и web/
        if: env.SIGNING == 'yes'
        run: python3 tools/build_prototype.py

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: env.SIGNING == 'yes'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: env.SIGNING == 'yes'
        with:
          gradle-version: '8.9'
          cache-read-only: true

      - name: Собрать release APK
        if: env.SIGNING == 'yes'
        env:
          AUTOHUB_KEYSTORE_PASSWORD: ${{ secrets.AUTOHUB_KEYSTORE_PASSWORD }}
          AUTOHUB_KEY_ALIAS: ${{ secrets.AUTOHUB_KEY_ALIAS }}
          AUTOHUB_KEY_PASSWORD: ${{ secrets.AUTOHUB_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease 2>&1 | tee gradle-release.log || {
            { grep -E "^e: |^.*\.(kt|java):[0-9]+: error" gradle-release.log | head -6; grep -A4 "What went wrong" gradle-release.log | head -4; } | while IFS= read -r l; do echo "::error title=gradle::$l"; done
            exit 1; }
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error title=Подпись release::Нет подписанного $APK (собран только unsigned?)"; exit 1; }
          cp "$APK" "AutoHub-${BUILD}.apk"

      - name: Проверить подпись, debuggable и модели OCR в APK
        if: env.SIGNING == 'yes'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs "AutoHub-${BUILD}.apk" | grep -E "Signer #1 certificate (DN|SHA-256)"; fi
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT" ]; then
            if "$AAPT" dump badging "AutoHub-${BUILD}.apk" | grep -q "application-debuggable"; then echo "::error title=release::APK собран как debuggable"; exit 1; fi
          fi
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          with zipfile.ZipFile('AutoHub-%s.apk' % os.environ['BUILD']) as apk:
              manifest = json.loads(apk.read('assets/ocr-models.json'))
              for lang in ('rus', 'eng'):
                  assert hashlib.sha256(apk.read(f'assets/tessdata/{lang}.traineddata')).hexdigest() == manifest[lang]
          print('Both OCR models are bundled and verified')
          PY

      - name: Удалить файл ключа
        if: always()
        run: rm -f "$RUNNER_TEMP/autohub-release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.SIGNING == 'yes'
        with:
          name: AutoHub-${{ env.BUILD }}
          path: AutoHub-${{ env.BUILD }}.apk
          retention-days: 7

      - name: Описание релиза из CHANGELOG.md
        if: env.SIGNING == 'yes'
        run: |
          awk -v v="## Сборка ${BUILD} " 'index($0, v)==1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Сборка ${BUILD}" > notes.md
          printf '\nФайл для Android: AutoHub-%s.apk. Установка поверх предыдущей версии.\n' "$BUILD" >> notes.md

      - name: Релиз «АвтоХаб <номер>»
        if: env.SIGNING == 'yes'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.BUILD }}
          name: АвтоХаб ${{ env.BUILD }}
          body_path: notes.md
          files: AutoHub-${{ env.BUILD }}.apk
          make_latest: true
